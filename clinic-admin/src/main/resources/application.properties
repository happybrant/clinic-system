# clinic-override 必须放最后：import 进来的配置会覆盖本文件同名项
spring.config.import=classpath:framework-default.properties,classpath:security-default.properties,classpath:utility-default.properties,classpath:clinic-override.properties
server.port=8084
spring.application.name=clinic-admin
spring.datasource.url=jdbc:mysql://localhost:3306/clinic?characterEncoding=utf-8&useSSL=false&serverTimezone=Hongkong&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
